<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>Truth Table for Logical Operators</h2>
    <table>
        <tr>
            <th>p</th>
            <th>q</th>
            <th>p ^ q</th>
            <th>p v q</th>
            <th>p -> q</th>
            <th>p <-> q</th>
        </tr>
        <tr>
            <td>true</td>
            <td>true</td>
            <td>true</td>
            <td>true</td>
            <td>true</td>
            <td>true</td>
        </tr>
        <tr>
            <td>true</td>
            <td>false</td>
            <td>false</td>
            <td>true</td>
            <td>false</td>
            <td>false</td>
        </tr>
        <tr>
            <td>false</td>
            <td>true</td>
            <td>false</td>
            <td>true</td>
            <td>true</td>
            <td>false</td>
        </tr>
        <tr>
            <td>false</td>
            <td>false</td>
            <td>false</td>
            <td>false</td>
            <td>true</td>
            <td>true</td>
        </tr>
    </table>
</body>
</html>
